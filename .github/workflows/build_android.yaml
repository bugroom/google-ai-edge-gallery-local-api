name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Generate build timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Rename APK with timestamp
        run: |
          mv Android/src/app/build/outputs/apk/release/app-release.apk \
             Android/src/app/build/outputs/apk/release/google-ai-edge-gallery-local-api-v1.0.15-${{ steps.timestamp.outputs.ts }}.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: google-ai-edge-gallery-local-api-release-${{ steps.timestamp.outputs.ts }}
          path: Android/src/app/build/outputs/apk/release/google-ai-edge-gallery-local-api-v1.0.15-${{ steps.timestamp.outputs.ts }}.apk

      - name: Delete old release tag if exists
        working-directory: ${{ github.workspace }}
        run: |
          gh release delete v1.0.15-latest --yes || true
          git push origin :refs/tags/v1.0.15-latest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.15-latest
          name: Gallery Local API - Latest Build
          body: |
            自动构建的 APK 文件
            
            **版本**: v1.0.15
            **构建时间**: ${{ github.event.head_commit.timestamp }}
            **提交**: ${{ github.sha }}
            
            ### 安装说明
            1. 下载 `app-release.apk`
            2. 在 Android 设备上安装（需要允许未知来源应用）
            3. 首次启动需要下载 LLM 模型
            
            ### 注意事项
            - 此版本为自动构建，可能包含未测试的功能
            - 生产环境使用请等待正式 Release
          files: |
            Android/src/app/build/outputs/apk/release/google-ai-edge-gallery-local-api-v1.0.15-${{ steps.timestamp.outputs.ts }}.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
